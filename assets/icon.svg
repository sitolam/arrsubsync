<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="arrsubsync">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9cf9"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- the audio: what the subtitle is aligned against -->
  <g fill="#fff" opacity=".95">
    <rect x="13" y="22" width="4" height="10" rx="2"/>
    <rect x="21" y="16" width="4" height="22" rx="2"/>
    <rect x="29" y="20" width="4" height="14" rx="2"/>
    <rect x="37" y="13" width="4" height="28" rx="2"/>
    <rect x="45" y="19" width="4" height="16" rx="2"/>
  </g>
  <!-- the subtitle, sitting under it, in step -->
  <g fill="#fff">
    <rect x="13" y="45" width="28" height="5" rx="2.5"/>
    <rect x="45" y="45" width="6" height="5" rx="2.5" opacity=".55"/>
  </g>
</svg>
