# Paste this service block into the `services:` section of your existing
# docker-compose.yml, next to Bazarr. No need to clone this repo - the image is
# published to GHCR for amd64 and arm64.
#
# Two things must match your stack:
#
#   1. The media mount must be IDENTICAL to Bazarr's. If Bazarr has
#      `/mnt/media:/data`, use `/mnt/media:/data` here too - then a path
#      Bazarr reports is valid inside this container unchanged.
#
#   2. The network must be the one Bazarr is on, so it can reach
#      http://alass-sync:8765 by container name.
#
# No ports are published: only Bazarr needs to reach this service.

  alass-sync:
    image: ghcr.io/sitolam/alass-sync:latest
    container_name: alass-sync
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      MEDIA_ROOT: /data
      ALASS_TIMEOUT: 120
      MAX_CONCURRENCY: 2
      LOG_LEVEL: INFO
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # CHANGE THIS to the same host:container media mount Bazarr uses:
      - /mnt/media:/data
    networks:
      # CHANGE THIS to the network Bazarr is on. If your compose file uses the
      # default network, delete these two lines entirely - it works as is.
      - media

# Pin a version instead of :latest if you prefer, e.g.
#   image: ghcr.io/sitolam/alass-sync:1.0
#
# To build from source instead of pulling, clone the repo next to your compose
# file and swap the image line for:
#   build: ./alass-sync
#
# If your stack assigns static IPs on a custom subnet, use the mapping form
# instead and pick an address that is not already taken:
#
#     networks:
#       media:
#         ipv4_address: 10.0.0.42
