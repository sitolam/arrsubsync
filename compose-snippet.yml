# Paste this into the `services:` section of your docker-compose.yml, next to
# Bazarr. The image is published for amd64 and arm64 - nothing to clone.
#
# Two things must match your stack:
#   1. The media mount must be IDENTICAL to Bazarr's, so paths line up 1:1.
#   2. The network must be one Bazarr is on, so it can reach
#      http://arrsubsync:8765 by name.

  arrsubsync:
    image: ghcr.io/sitolam/arrsubsync:latest
    container_name: arrsubsync
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Dashboard login. Omit to choose a password on first visit instead.
      ARRSUBSYNC_USERNAME: admin
      ARRSUBSYNC_PASSWORD: ${ARRSUBSYNC_PASSWORD:?set this in your .env}
      # Optional: fill these in here or from the Settings page.
      BAZARR_URL: http://bazarr:6767
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
    volumes:
      - ./arrsubsync:/config          # database, settings, session secret
      - /mnt/media:/data              # CHANGE: same media mount Bazarr uses
    ports:
      - 8765:8765                     # the dashboard; drop this to keep it internal
    networks:
      - media                         # CHANGE: the network Bazarr is on

# If your stack pins static IPs, use the mapping form instead:
#
#     networks:
#       media:
#         ipv4_address: 10.0.0.42
