name: Docker

# Builds the image and publishes it to GHCR so nobody has to clone this repo
# to run the service.
#
#   push to main   -> ghcr.io/<owner>/alass-sync:main and :edge
#   tag vX.Y.Z     -> :X.Y.Z, :X.Y, :X and :latest
#   pull request   -> build only, nothing is pushed
#
# amd64 and arm64 are built on native runners rather than under QEMU: upstream
# alass ships no arm64 binary, so that leg compiles Rust from source and
# emulation would make it painfully slow. Each leg pushes a digest, and the
# merge job stitches them into one multi-arch tag.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker buildx build --load --platform ${{ matrix.platform }} \
            --cache-from type=gha,scope=${{ env.PLATFORM_PAIR }} \
            -t arrsubsync:smoke .
          mkdir -p .smoke
          docker run -d --name smoke -v "$PWD/.smoke:/data" -e ARRSUBSYNC_NO_AUTH=true arrsubsync:smoke
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs smoke; exit 1; }
            sleep 2
          done
          docker exec smoke alass --version
          docker exec smoke ffprobe -version | head -n1
          docker exec smoke python -c "import json,urllib.request; \
            b=json.loads(urllib.request.urlopen('http://127.0.0.1:8765/health').read()); \
            print(b); assert b['status']=='ok'"
          docker exec smoke python -c "import urllib.request; \
            html=urllib.request.urlopen('http://127.0.0.1:8765/').read().decode(); \
            assert 'arrsubsync' in html, 'dashboard did not render'"
          docker exec smoke python -m app.cli status
          docker rm -f smoke

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tags
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=arrsubsync
            org.opencontainers.image.description=Keeps an *arr subtitle library in sync, powered by alass

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
